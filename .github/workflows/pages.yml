name: Deploy Unique Chat to GitHub Pages
on:
  push:
    branches: [main]
    paths-ignore:
      - backend-url.json
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check modules
        run: for file in js/*.js js/knowledge/*.js scripts/*.mjs; do node --experimental-default-type=module --check "$file"; done
      - name: Validate automatic Codespaces startup script
        run: |
          bash -n scripts/auto-publish.sh
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          const dev = JSON.parse(await readFile(".devcontainer/devcontainer.json", "utf8"));
          const script = await readFile("scripts/auto-publish.sh", "utf8");
          assert.equal(dev.postStartCommand, "bash scripts/auto-publish.sh");
          assert.ok(script.includes("npm --prefix"));
          assert.ok(script.includes("node \"$ROOT_DIR/backend/server.js\""));
          assert.ok(script.includes("/api/health"));
          assert.ok(script.includes("/contents/backend-url.json"));
          assert.ok(script.includes('branch: "main"'));
          console.log("PASS: Codespaces startup script syntax and automatic publish wiring");
          NODE
      - name: Verify Codespaces discovery wiring
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const config = await readFile('js/config.js', 'utf8');
          const app = await readFile('js/app.js', 'utf8');
          const auth = await readFile('js/auth-session.js', 'utf8');
          const dev = JSON.parse(await readFile('.devcontainer/devcontainer.json', 'utf8'));
          assert.match(config, /raw.githubusercontent.com/);
          assert.match(config, /backend-url.json/);
          assert.match(config, /manifest.status === "active"/);
          assert.match(config, /await isHealthy\(discovered\)/);
          assert.match(app, /await getApiBaseUrl\(\)/);
          assert.match(auth, /await getApiBaseUrl\(\)/);
          assert.equal(dev.portsAttributes["3000"].visibility, "public");
          assert.equal(dev.customizations.codespaces.repositories["uniquenetworkbd/Chatbot"].permissions.contents, "write");
          console.log("PASS: GitHub Codespaces discovery wiring and required permissions");
          NODE
      - name: Test frontend and API bridge safeguards
        run: |
          node --experimental-default-type=module --input-type=module <<'NODE'
          import assert from 'node:assert/strict';import {access,readFile} from 'node:fs/promises';import {searchKnowledge,FALLBACK_RESPONSE,getKnowledgeStats,tokenize} from './js/knowledge/index.js';import {professionalIspKnowledge,professionalIspKnowledgeMeta} from './js/knowledge/professional-isp.js';
          for(const p of ['index.html','layout.html','profile.html','backend-url.json','scripts/codespaces-start.sh','scripts/publish-codespaces-backend-url.mjs','css/main.css','css/chat.css','css/navigation.css','js/config.js','js/app.js','js/navigation.js','js/knowledge/index.js','js/knowledge/company.js','js/knowledge/internet.js','js/knowledge/billing.js','js/knowledge/security.js','js/knowledge/synonyms.js','js/knowledge/professional-isp.js','js/wizard.js','js/tools-page.js','js/admin-analytics.js','css/advanced-tools.css','css/network-config.css','css/auth.css','js/network-config.js','js/auth-session.js','js/workspace.js'])await access(p);
          const app=await readFile('js/app.js','utf8'),cfg=await readFile('js/config.js','utf8');assert.match(app,/QUEUE_KEY/);assert.match(app,/clientEventId/);assert.match(app,/AbortController/);assert.match(app,/healthCheckPromise/);assert.match(cfg,/UNBD_API_BASE_URL/);const networkUi=await readFile('js/network-config.js','utf8');assert.doesNotMatch(networkUi,/localStorage/);assert.match(networkUi,/https:/);assert.match(networkUi,/connect-test/);const auth=await readFile('js/auth-session.js','utf8');assert.doesNotMatch(auth,/sessionStorage|localStorage/);assert.match(auth,/let sessionToken =/);assert.match(auth,/initializeNavigation/);assert.match(auth,/api\/auth\/login/);assert.match(auth,/api\/auth\/logout/);assert.match(auth,/api\/auth\/session/);assert.match(auth,/ensureAuthenticated/);
          const cases=[['হ্যালো','আসসালামু আলাইকুম'],['Unique Network BD','মাইজদী সদর'],['অফিস সময়সূচি','শনিবার'],['ইন্টারনেট নেই রাউটার ONU restart','ONU/MC'],['MikroTik BDCOM OLT','MikroTik'],['bKash Nagad ONE Bank payment','bKash'],['TrxID verify','Transaction ID'],['ফেসবুক অ্যাকাউন্ট রিকভারি','Account Recovery'],['ফিশিং প্রতারণা','ফিশিং'],['black hat hacking','Black-hat']];for(const[q,w]of cases){const r=searchKnowledge(q);assert.equal(r.matched,true);assert.ok(r.response.includes(w));}const banglish=tokenize('net slow');assert.ok(banglish.includes('internet_slow'));assert.ok(banglish.includes('ইন্টারনেট'));const billing=tokenize('taka koto');assert.ok(billing.includes('billing_amount'));assert.ok(billing.includes('বিল'));const f=searchKnowledge('আজকের আবহাওয়া');assert.equal(f.matched,false);assert.equal(f.response,FALLBACK_RESPONSE);assert.equal(professionalIspKnowledge.length,940);assert.equal(professionalIspKnowledgeMeta.topicCount,188);assert.equal(professionalIspKnowledgeMeta.companyDataRequired,330);assert.equal(professionalIspKnowledgeMeta.generalGuidance,610);assert.equal(new Set(professionalIspKnowledge.map(x=>x.id)).size,940);assert.equal(getKnowledgeStats().documents,952);assert.equal(getKnowledgeStats().professionalCards,940);for(const [q,category] of [['LOS red indicator','onu'],['PPPoE discovery','advanced'],['area-wide outage','emergency'],['ticket priority','tickets']]){const r=searchKnowledge(q);assert.equal(r.matched,true,`knowledge query should match: ${q}`);assert.equal(r.category,category,`knowledge category should match: ${q}`);}console.log('PASS: frontend modules, offline queue safeguards and 940-card ISP knowledge expansion');
          NODE
  browser-e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run real browser interaction tests
        run: node tests/profile.e2e.mjs
  build:
    runs-on: ubuntu-latest
    needs: [test, browser-e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage static frontend only
        run: |
          rm -rf _site && mkdir -p _site
          cp index.html layout.html profile.html _site/
          cp -R css js _site/
          touch _site/.nojekyll
          test -f _site/index.html && test -f _site/js/config.js
          du -sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
          error_count: 20
          reporting_interval: 10000
  verify-live:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium for live-site browser verification
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify deployed website and Chatbot Profile over HTTPS
        env:
          SITE_URL: https://uniquenetworkbd.github.io/Chatbot
        run: |
          set -euo pipefail
          fetch_page() {
            local url="$1"
            local output="$2"
            for attempt in $(seq 1 18); do
              if curl --fail --silent --show-error --location --max-time 20 "$url?live_check=$(date +%s)" -o "$output"; then
                return 0
              fi
              echo "Attempt $attempt/18: waiting for GitHub Pages propagation..."
              sleep 5
            done
            echo "ERROR: HTTPS page did not become available: $url"
            return 1
          }
          fetch_page "$SITE_URL/" /tmp/chatbot-home.html
          fetch_page "$SITE_URL/profile.html" /tmp/chatbot-profile.html
          grep -q 'Unique Network BD' /tmp/chatbot-home.html
          grep -q 'Chatbot Profile | Unique Network BD' /tmp/chatbot-profile.html
          grep -q './js/workspace.js' /tmp/chatbot-profile.html
          curl --fail --silent --show-error --location --max-time 20 "$SITE_URL/css/profile.css" -o /tmp/chatbot-profile.css
          curl --fail --silent --show-error --location --max-time 20 "$SITE_URL/js/profile.js" -o /tmp/chatbot-profile.js
          curl --fail --silent --show-error --location --max-time 20 "$SITE_URL/css/chat.css" -o /tmp/chatbot-chat.css
          curl --fail --silent --show-error --location --max-time 20 "$SITE_URL/js/app.js" -o /tmp/chatbot-app.js
          grep -q 'profile-doc-preview' /tmp/chatbot-profile.css
          grep -q 'initializeProfilePage' /tmp/chatbot-profile.js
          grep -q 'Document Quality & Response Metrics' /tmp/chatbot-profile.js
          grep -q 'Live System & API Monitor' /tmp/chatbot-profile.js
          grep -q 'profile-pagination' /tmp/chatbot-profile.css
          grep -q 'overflow-y:auto' /tmp/chatbot-chat.css
          grep -q 'top:-4rem' /tmp/chatbot-chat.css
          grep -q 'chatShell.scrollTo' /tmp/chatbot-app.js
          echo "PASS: Live HTTPS homepage, profile and chat assets are reachable; fixed composer and separated scroll control are deployed."
      - name: Run real mobile browser verification against deployed HTTPS site
        env:
          SITE_URL: https://uniquenetworkbd.github.io/Chatbot
        run: node tests/live-chat.e2e.mjs
