name: Deploy Unique Chat to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check modules
        run: for file in js/*.js js/knowledge/*.js; do node --experimental-default-type=module --check "$file"; done
      - name: Test frontend and API bridge safeguards
        run: |
          node --experimental-default-type=module --input-type=module <<'NODE'
          import assert from 'node:assert/strict';import {access,readFile} from 'node:fs/promises';import {searchKnowledge,FALLBACK_RESPONSE,getKnowledgeStats,tokenize} from './js/knowledge/index.js';
          for(const p of ['index.html','layout.html','css/main.css','css/chat.css','css/navigation.css','js/config.js','js/app.js','js/navigation.js','js/knowledge/index.js','js/knowledge/company.js','js/knowledge/internet.js','js/knowledge/billing.js','js/knowledge/security.js','js/knowledge/synonyms.js','js/wizard.js','js/tools-page.js','js/admin-analytics.js','css/advanced-tools.css','css/network-config.css','js/network-config.js'])await access(p);
          const app=await readFile('js/app.js','utf8'),cfg=await readFile('js/config.js','utf8');assert.match(app,/QUEUE_KEY/);assert.match(app,/clientEventId/);assert.match(app,/AbortController/);assert.match(app,/healthCheckPromise/);assert.match(cfg,/UNBD_API_BASE_URL/);const networkUi=await readFile('js/network-config.js','utf8');assert.doesNotMatch(networkUi,/localStorage/);assert.match(networkUi,/connect-test/);
          const cases=[['হ্যালো','আসসালামু আলাইকুম'],['Unique Network BD','মাইজদী সদর'],['অফিস সময়সূচি','শনিবার'],['ইন্টারনেট নেই রাউটার ONU restart','ONU/MC'],['MikroTik BDCOM OLT','MikroTik'],['bKash Nagad ONE Bank payment','bKash'],['TrxID verify','Transaction ID'],['ফেসবুক অ্যাকাউন্ট রিকভারি','Account Recovery'],['ফিশিং প্রতারণা','ফিশিং'],['black hat hacking','Black-hat']];for(const[q,w]of cases){const r=searchKnowledge(q);assert.equal(r.matched,true);assert.ok(r.response.includes(w));}const banglish=tokenize('net slow');assert.ok(banglish.includes('internet_slow'));assert.ok(banglish.includes('ইন্টারনেট'));const billing=tokenize('taka koto');assert.ok(billing.includes('billing_amount'));assert.ok(billing.includes('বিল'));const f=searchKnowledge('আজকের আবহাওয়া');assert.equal(f.matched,false);assert.equal(f.response,FALLBACK_RESPONSE);assert.equal(getKnowledgeStats().documents,12);console.log('PASS: frontend modules, offline queue safeguards and knowledge search');
          NODE
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage static frontend only
        run: |
          rm -rf _site && mkdir -p _site
          cp index.html layout.html _site/
          cp -R css js _site/
          touch _site/.nojekyll
          test -f _site/index.html && test -f _site/js/config.js
          du -sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
          error_count: 20
          reporting_interval: 10000
