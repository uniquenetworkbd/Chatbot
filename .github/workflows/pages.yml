name: Deploy Unique Chat to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  test:
    name: Two-pass modular application tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test pass 1 - paths, modules, search, fallback and safe rendering
        run: |
          node --experimental-default-type=module --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { access, readFile } from 'node:fs/promises';
          import { searchKnowledge, FALLBACK_RESPONSE, getKnowledgeStats } from './js/knowledge/index.js';
          const paths = ['index.html','layout.html','css/main.css','css/chat.css','css/navigation.css','js/app.js','js/navigation.js','js/knowledge/index.js','js/knowledge/company.js','js/knowledge/internet.js','js/knowledge/billing.js','js/knowledge/security.js'];
          for (const path of paths) await access(path);
          const html = await readFile('index.html','utf8');
          assert.match(html, /type="module" src="\.\/js\/app\.js"/);
          for (const css of ['./css/main.css','./css/navigation.css','./css/chat.css']) assert.ok(html.includes(css));
          const app = await readFile('js/app.js','utf8');
          const nav = await readFile('js/navigation.js','utf8');
          assert.match(app, /textContent = text/);
          assert.match(app, /localStorage/);
          assert.match(nav, /document\.addEventListener\("click"/);
          assert.match(nav, /layout\.html\?page=/);
          const cases = [
            ['হ্যালো','আসসালামু আলাইকুম'],
            ['Unique Network BD','মাইজদী সদর'],
            ['অফিস সময়সূচি','শনিবার'],
            ['ইন্টারনেট নেই রাউটার ONU restart','ONU/MC'],
            ['MikroTik BDCOM OLT','MikroTik'],
            ['bKash Nagad ONE Bank payment','bKash'],
            ['TrxID payment verify','Transaction ID'],
            ['ফেসবুক অ্যাকাউন্ট রিকভারি','Account Recovery'],
            ['ফিশিং প্রতারণা','ফিশিং'],
            ['black hat hacking','Black-hat']
          ];
          for (const [query, expected] of cases) {
            const result = searchKnowledge(query);
            assert.equal(result.matched, true, 'Expected match for: ' + query);
            assert.ok(result.response.includes(expected), 'Unexpected response for: ' + query);
          }
          const fallback = searchKnowledge('আজকের আবহাওয়া');
          assert.equal(fallback.matched, false);
          assert.equal(fallback.response, FALLBACK_RESPONSE);
          assert.equal(getKnowledgeStats().documents, 12);
          console.log('PASS: 12 paths, HTML/CSS references, ES module imports, 10 knowledge cases, fallback and source safety checks');
          NODE
      - name: Test pass 2 - repeat regression verification
        run: |
          node --experimental-default-type=module --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { access, readFile } from 'node:fs/promises';
          import { searchKnowledge, FALLBACK_RESPONSE, getKnowledgeStats } from './js/knowledge/index.js';
          const paths = ['index.html','layout.html','css/main.css','css/chat.css','css/navigation.css','js/app.js','js/navigation.js','js/knowledge/index.js','js/knowledge/company.js','js/knowledge/internet.js','js/knowledge/billing.js','js/knowledge/security.js'];
          for (const path of paths) await access(path);
          const html = await readFile('index.html','utf8');
          assert.match(html, /type="module" src="\.\/js\/app\.js"/);
          const app = await readFile('js/app.js','utf8');
          const nav = await readFile('js/navigation.js','utf8');
          assert.match(app, /textContent = text/);
          assert.match(app, /localStorage/);
          assert.match(nav, /document\.addEventListener\("click"/);
          assert.match(nav, /layout\.html\?page=/);
          const cases = [
            ['হ্যালো','আসসালামু আলাইকুম'],
            ['Unique Network BD','মাইজদী সদর'],
            ['অফিস সময়সূচি','শনিবার'],
            ['ইন্টারনেট নেই রাউটার ONU restart','ONU/MC'],
            ['MikroTik BDCOM OLT','MikroTik'],
            ['bKash Nagad ONE Bank payment','bKash'],
            ['TrxID payment verify','Transaction ID'],
            ['ফেসবুক অ্যাকাউন্ট রিকভারি','Account Recovery'],
            ['ফিশিং প্রতারণা','ফিশিং'],
            ['black hat hacking','Black-hat']
          ];
          for (const [query, expected] of cases) {
            const result = searchKnowledge(query);
            assert.equal(result.matched, true, 'Expected match for: ' + query);
            assert.ok(result.response.includes(expected), 'Unexpected response for: ' + query);
          }
          const fallback = searchKnowledge('আজকের আবহাওয়া');
          assert.equal(fallback.matched, false);
          assert.equal(fallback.response, FALLBACK_RESPONSE);
          assert.equal(getKnowledgeStats().documents, 12);
          console.log('PASS: second independent regression pass completed');
          NODE
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
